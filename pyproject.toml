[project]
name = "benchmark1d2d"
version = "0.2.1"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "pandas", "pyarrow", "jsonschema", "cryptography", "matplotlib"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
benchmark1d2d = "benchmark1d2d.cli.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["runner/python", "."]
include = ["benchmark1d2d*", "references*"]

[tool.pytest.ini_options]
testpaths = ["runner/python/tests", "references/tests", "schemas/v1/tests"]
pythonpath = ["runner/python", "."]
