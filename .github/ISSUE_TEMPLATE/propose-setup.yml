name: Propose a better set-up
description: Know a solver well? Propose different settings for one of the suite's models. The suite re-runs it and shows the result beside its own, under your name.
title: "Set-up: "
labels: [set-up proposal]
body:
  - type: markdown
    attributes:
      value: |
        The suite applies your settings to its own model files for that model and re-runs the solver on its own machines.
        The result is shown **beside** the suite's own result, under your name; it never replaces it, and no one approves it.
        Settings the test defines (geometry, boundaries, friction, the grid, the end time) cannot be changed.
        Each result's "Check this result" box on the test pages has the model files and settings to start from.
  - type: dropdown
    id: base
    attributes:
      label: Model
      description: The suite's model your set-up starts from.
      options:
        - swmm524 (EPA SWMM 5.2.4)
        - swmm515 (EPA SWMM 5.1.15)
        - openswmm-dw (OpenSWMM Engine v6, dynamic wave)
        - openswmm-fv (OpenSWMM Engine v6, finite volume)
        - telemac (openTELEMAC-2D 9.1)
        - lisflood-fv1 (LISFLOOD-FP 8.3, FV1)
        - lisflood-dg2 (LISFLOOD-FP 8.3, DG2)
        - lisflood-acc (LISFLOOD-FP 8.3, ACC)
    validations:
      required: true
  - type: input
    id: title
    attributes:
      label: Short name
      description: Shown beside the result, e.g. "tighter head tolerance".
    validations:
      required: true
  - type: input
    id: proposed_by
    attributes:
      label: Your name or organisation
      description: Shown on the site with the GitHub account you send this from.
    validations:
      required: true
  - type: textarea
    id: settings
    attributes:
      label: Settings
      description: One per line, as the solver's input file spells it. SWMM [OPTIONS] keywords, TELEMAC steering-file keywords, LISFLOOD-FP .par keywords.
      placeholder: |
        HEAD_TOLERANCE 0.00001
        MAX_TRIALS 30
      render: text
    validations:
      required: true
  - type: input
    id: tests
    attributes:
      label: Tests
      description: Test ids (e.g. "A1F-010, A1F-011"), or "all".
      value: all
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Why these settings
      description: What they fix, and when an engineer would use them.
    validations:
      required: true
  - type: dropdown
    id: tier
    attributes:
      label: Kind of set-up
      options:
        - An expert's choice (T2)
        - Exactly the developer's published guidance (T1)
    validations:
      required: true
  - type: input
    id: guidance
    attributes:
      label: Developer's guidance (for T1)
      description: Where the developer publishes this guidance (a link, or a manual and section).
  - type: checkboxes
    id: developer
    attributes:
      label: Developer
      options:
        - label: I develop or maintain this software
