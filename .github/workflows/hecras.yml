            out/hecras*2d/*/*.parquet
            out/hecras*2d/work/**/*.txt
            out/hecras*2d/work/**/*.p0?
            out/hecras*2d/work/**/*.u0?
            out/hecras*2d/work/**/*.g01
            out/hecras*2d/work/**/*.prj
            out/hecras*2d/work/**/*.rasmap
            out/hecras*2d/work/**/*.log
            out/hecras*2d/work/**/*.bco*
            out/hecras*2d/work/**/*.x01
            out/hecras*2d/work/**/*.rst
            out/curves/**/*.curve.json
            out/inputs_zip/*.inputs.zip

  hecras-2d-cases:
    name: HEC-RAS ${{ matrix.ras }} 2D with boundary lines, ${{ matrix.eq }} (finding, not a gate)
    if: github.event_name != 'workflow_dispatch' || inputs.jobs == 'all' || inputs.jobs == 'cases'
    runs-on: windows-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        eq: [elm, em]
        ras: ["7.0.1", "6.6"]
        include:
          - ras: "7.0.1"
            tag: ""
            rc: "0.106.1"
            url: https://github.com/HydrologicEngineeringCenter/hec-downloads/releases/download/1.0.46/HEC-RAS_701_Setup.exe
            sha: 1FE76297076AA7A13E43191ECC76C3BA152FDC4BBD606FA2C349EEC7DB3CEE73
          - ras: "6.6"
            tag: "66"
            rc: "0.105.0"
            url: https://github.com/HydrologicEngineeringCenter/hec-downloads/releases/download/1.0.33/HEC-RAS_66_Setup.exe
            sha: 42A370B17A43892B17BD941DD0DB5415B97CBAE6C9CDA38EB11544ECE74715EB
    env:
      HECRAS_TAG: ${{ matrix.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" "ras-commander==${{ matrix.rc }}" h5py psutil pywin32 pillow pythonnet tifffile
      - name: Fetch remote inputs (EA terrain, verified by SHA-256)
        run: python scripts/fetch_inputs.py
      - uses: actions/cache@v4
        with:
          path: .cache/hecras
          key: hecras-${{ matrix.ras }}-setup-v1
      - name: Install HEC-RAS ${{ matrix.ras }} silently
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .cache/hecras | Out-Null
          $exe = ".cache/hecras/" + [IO.Path]::GetFileName("${{ matrix.url }}")
          if (-not (Test-Path $exe)) { Invoke-WebRequest "${{ matrix.url }}" -OutFile $exe }
          $sha = (Get-FileHash $exe -Algorithm SHA256).Hash
          if ($sha -ne "${{ matrix.sha }}") { throw "HEC-RAS installer hash $sha does not match the pinned ${{ matrix.sha }}" }
          $p = Start-Process -FilePath (Resolve-Path $exe) -ArgumentList '/S', '/v/qn' -Wait -PassThru
          "installer exit code: $($p.ExitCode)"
          # HEC-RAS 7's compute engines link HDF5 built against the Visual C++ 2010 runtime (MSVCR100.dll),
          # which HEC's installer expects on the machine and the runner image does not have
          if (-not (Test-Path "$env:SystemRoot\System32\msvcr100.dll")) { choco install vcredist2010 -y --no-progress | Select-Object -Last 3 }
          Get-ChildItem 'C:\Program Files (x86)\HEC', 'C:\Program Files\HEC' -Recurse -Filter Ras.exe -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName }
      - name: Run and score HEC-RAS 2D (MacDonald 2D, EA tests)
        timeout-minutes: 270
        shell: bash
        run: python scripts/run_hecras_2d_cases.py ${{ inputs.cases }} --accept-hec-terms --equations ${{ matrix.eq }}
      - name: Export the chart curves (site/fixtures/curves via the result collector)
        if: always()
        shell: bash
        run: python scripts/export_curves.py || echo "::warning title=Chart curves::not exported"
      - name: Zip the kept model files (site/fixtures/inputs via the result collector)
        if: always()
        shell: bash
        run: python scripts/export_inputs.py || echo "::warning title=Model files::not zipped"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hecras-2d-cases-${{ matrix.ras }}-${{ matrix.eq }}
          path: |
            out/hecras*2d/*/*.scorecard.json
            out/hecras*2d/*/*.parquet
            out/hecras*2d/work/**/*.txt
            out/hecras*2d/work/**/*.p0?
            out/hecras*2d/work/**/*.u0?
            out/hecras*2d/work/**/*.g01
            out/hecras*2d/work/**/*.log
            out/hecras*2d/work/**/*.bco*
            out/curves/**/*.curve.json
            out/inputs_zip/*.inputs.zip

  hecras-pipes:
    name: HEC-RAS ${{ matrix.ras }} pipe networks on the 1D/2D tests (finding, not a gate)
    if: github.event_name != 'workflow_dispatch' || inputs.jobs == 'all' || inputs.jobs == 'pipes'
    runs-on: windows-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - ras: "7.0.1"
            rc: "0.106.1"
            url: https://github.com/HydrologicEngineeringCenter/hec-downloads/releases/download/1.0.46/HEC-RAS_701_Setup.exe
            sha: 1FE76297076AA7A13E43191ECC76C3BA152FDC4BBD606FA2C349EEC7DB3CEE73
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" "ras-commander==${{ matrix.rc }}" h5py psutil pywin32 pillow pythonnet tifffile shapely
      - uses: actions/cache@v4
        with:
          path: .cache/hecras
          key: hecras-${{ matrix.ras }}-setup-v1
      - name: Install HEC-RAS ${{ matrix.ras }} silently
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .cache/hecras | Out-Null
          $exe = ".cache/hecras/" + [IO.Path]::GetFileName("${{ matrix.url }}")
          if (-not (Test-Path $exe)) { Invoke-WebRequest "${{ matrix.url }}" -OutFile $exe }
          $sha = (Get-FileHash $exe -Algorithm SHA256).Hash
          if ($sha -ne "${{ matrix.sha }}") { throw "HEC-RAS installer hash $sha does not match the pinned ${{ matrix.sha }}" }
          $p = Start-Process -FilePath (Resolve-Path $exe) -ArgumentList '/S', '/v/qn' -Wait -PassThru
          "installer exit code: $($p.ExitCode)"
          # HEC-RAS 7's compute engines link HDF5 built against the Visual C++ 2010 runtime (MSVCR100.dll),
          # which HEC's installer expects on the machine and the runner image does not have
          if (-not (Test-Path "$env:SystemRoot\System32\msvcr100.dll")) { choco install vcredist2010 -y --no-progress | Select-Object -Last 3 }
          Get-ChildItem 'C:\Program Files (x86)\HEC', 'C:\Program Files\HEC' -Recurse -Filter Ras.exe -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName }
      - name: Run and score the coupling cases
        timeout-minutes: 100
        run: python scripts/run_hecras_pipes.py --accept-hec-terms
      - name: Zip the kept model files (site/fixtures/inputs via the result collector)
        if: always()
        shell: bash
        run: python scripts/export_inputs.py || echo "::warning title=Model files::not zipped"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hecras-pipes
          path: |
            out/coupled/hecras-pipes/*.scorecard.json
            out/coupled/hecras-pipes/*.parquet
            out/coupled/hecras-pipes/work/**/*.u01
            out/coupled/hecras-pipes/work/**/*.p01
            out/coupled/hecras-pipes/work/**/*.g01
            out/coupled/hecras-pipes/work/**/*.b01
            out/coupled/hecras-pipes/work/**/*.log
            out/coupled/hecras-pipes/work/**/*.txt
            out/inputs_zip/*.inputs.zip

  probe:
    name: HEC-RAS 7.0.1 pipe-network probe (diagnostics)
    if: (github.event_name == 'workflow_dispatch' && inputs.jobs == 'probe')
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      matrix:
        include:
          - ras: "7.0.1"
            tag: ""
            rc: "0.106.1"
            url: https://github.com/HydrologicEngineeringCenter/hec-downloads/releases/download/1.0.46/HEC-RAS_701_Setup.exe
            sha: 1FE76297076AA7A13E43191ECC76C3BA152FDC4BBD606FA2C349EEC7DB3CEE73
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" "ras-commander==${{ matrix.rc }}" h5py psutil pywin32 pillow pythonnet tifffile pefile shapely
      - uses: actions/cache@v4
        with:
          path: .cache/hecras
          key: hecras-${{ matrix.ras }}-setup-v1
      - name: Install HEC-RAS ${{ matrix.ras }} silently
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .cache/hecras | Out-Null
          $exe = ".cache/hecras/" + [IO.Path]::GetFileName("${{ matrix.url }}")
          if (-not (Test-Path $exe)) { Invoke-WebRequest "${{ matrix.url }}" -OutFile $exe }
          $sha = (Get-FileHash $exe -Algorithm SHA256).Hash
          if ($sha -ne "${{ matrix.sha }}") { throw "HEC-RAS installer hash $sha does not match the pinned ${{ matrix.sha }}" }
          $p = Start-Process -FilePath (Resolve-Path $exe) -ArgumentList '/S', '/v/qn' -Wait -PassThru
          "installer exit code: $($p.ExitCode)"
          # HEC-RAS 7's compute engines link HDF5 built against the Visual C++ 2010 runtime (MSVCR100.dll),
          # which HEC's installer expects on the machine and the runner image does not have
          if (-not (Test-Path "$env:SystemRoot\System32\msvcr100.dll")) { choco install vcredist2010 -y --no-progress | Select-Object -Last 3 }
          Get-ChildItem 'C:\Program Files (x86)\HEC', 'C:\Program Files\HEC' -Recurse -Filter Ras.exe -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName }
      - name: How HEC-RAS writes and reads a pipe-node boundary (decompiled, excerpts only)
        continue-on-error: true
        shell: pwsh
        run: |
          dotnet tool install -g ilspycmd --version 9.1.0.7988 | Select-Object -Last 1
          $ras = Split-Path (Get-ChildItem 'C:\Program Files (x86)\HEC', 'C:\Program Files\HEC' -Recurse -Filter Ras.exe -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match '7\.0' } | Select-Object -First 1).FullName
          New-Item -ItemType Directory -Force out/hecras7probe/decomp | Out-Null
          foreach ($n in 'Ras.exe', 'RasMapperLib.dll', 'RAS.dll', 'RasCore.dll', 'RasData.dll') {
            $p = Join-Path $ras $n
            if (Test-Path $p) { ilspycmd $p -p -o "out/hecras7probe/decomp/$n" 2>&1 | Select-Object -Last 2 }
          }
          Get-ChildItem $ras -Filter *.dll | ForEach-Object { $_.Name } | Out-File out/hecras7probe/dlls.txt
          $hits = Get-ChildItem out/hecras7probe/decomp -Recurse -Filter *.cs | Select-String -Pattern 'PipeNode=|Pipe Node|PipeNetwork.*Boundary|Boundary Location=|BoundaryLocation|QPN|Pipe Networks/' -Context 6,10
          $hits | Out-File -Width 400 out/hecras7probe/decomp_hits.txt
          "hits: $($hits.Count)"
      - name: Probe
        timeout-minutes: 75
        run: python scripts/probe_hecras7.py --accept-hec-terms
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hecras7-probe
          path: |
            out/hecras7probe/*.txt
            out/hecras7probe/davis/**/*.txt
            out/hecras7probe/davis/**/*.log
