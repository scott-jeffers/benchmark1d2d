name: HEC-RAS

# HEC-RAS (USACE, public domain, Windows) installed silently from HEC's own
# GitHub release and run headless through ras-commander. A finding, not a gate.
# Every job runs on the current release (7.0.1) and on 6.6, kept as the
# previous release so a change between versions shows (HECRAS_TAG "66" sends
# 6.6's results to their own folders and model keys).
on:
  workflow_dispatch:
    inputs:
      jobs:
        description: "Which jobs to run: all, 1d, 2d, cases, pipes, probe"
        default: all
      cases:
        description: "Cases for the boundary-line job (space separated; empty = all)"
        default: ""
  push:
    branches: [master, hecras]
    paths:
      - scripts/run_hecras.py
      - scripts/run_hecras_2d.py
      - scripts/run_hecras_2d_cases.py
      - scripts/run_hecras_pipes.py
      - test_catalog/track_a/coupled_1d2d/**
      - .github/workflows/hecras.yml
      - test_catalog/track_a/1d_free_surface/**
      - test_catalog/track_a/2d_*/**
      - runner/python/benchmark1d2d/scoring/**

env:
  BENCH_KEEP_INPUTS: out/inputs  # runners keep a copy of the model files they write (Run it yourself)

jobs:
  hecras:
    name: HEC-RAS ${{ matrix.ras }} on the 1D cases (finding, not a gate)
    if: github.event_name != 'workflow_dispatch' || inputs.jobs == 'all' || inputs.jobs == '1d'
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - ras: "7.0.1"
            tag: ""
            rc: "0.106.1"
            url: https://github.com/HydrologicEngineeringCenter/hec-downloads/releases/download/1.0.46/HEC-RAS_701_Setup.exe
            sha: 1FE76297076AA7A13E43191ECC76C3BA152FDC4BBD606FA2C349EEC7DB3CEE73
          - ras: "6.6"
            tag: "66"
            rc: "0.105.0"
            url: https://github.com/HydrologicEngineeringCenter/hec-downloads/releases/download/1.0.33/HEC-RAS_66_Setup.exe
            sha: 42A370B17A43892B17BD941DD0DB5415B97CBAE6C9CDA38EB11544ECE74715EB
    env:
      HECRAS_TAG: ${{ matrix.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" "ras-commander==${{ matrix.rc }}" h5py psutil pywin32 pillow
      - uses: actions/cache@v4
        with:
          path: .cache/hecras
          key: hecras-${{ matrix.ras }}-setup-v1
      - name: Install HEC-RAS ${{ matrix.ras }} silently
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .cache/hecras | Out-Null
          $exe = ".cache/hecras/" + [IO.Path]::GetFileName("${{ matrix.url }}")
          if (-not (Test-Path $exe)) { Invoke-WebRequest "${{ matrix.url }}" -OutFile $exe }
          $sha = (Get-FileHash $exe -Algorithm SHA256).Hash
          if ($sha -ne "${{ matrix.sha }}") { throw "HEC-RAS installer hash $sha does not match the pinned ${{ matrix.sha }}" }
          $p = Start-Process -FilePath (Resolve-Path $exe) -ArgumentList '/S', '/v/qn' -Wait -PassThru
          "installer exit code: $($p.ExitCode)"
          # HEC-RAS 7's compute engines link HDF5 built against the Visual C++ 2010 runtime (MSVCR100.dll),
          # which HEC's installer expects on the machine and the runner image does not have
          if (-not (Test-Path "$env:SystemRoot\System32\msvcr100.dll")) { choco install vcredist2010 -y --no-progress | Select-Object -Last 3 }
          Get-ChildItem 'C:\Program Files (x86)\HEC', 'C:\Program Files\HEC' -Recurse -Filter Ras.exe -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName }
      - name: Run and score HEC-RAS
        timeout-minutes: 30
        run: python scripts/run_hecras.py --accept-hec-terms
      - name: Export the chart curves (site/fixtures/curves via the result collector)
        if: always()
        shell: bash
        run: python scripts/export_curves.py || echo "::warning title=Chart curves::not exported"
      - name: Zip the kept model files (site/fixtures/inputs via the result collector)
        if: always()
        shell: bash
        run: python scripts/export_inputs.py || echo "::warning title=Model files::not zipped"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hecras-${{ matrix.ras }}
          path: |
            out/hecras*/*.scorecard.json
            out/hecras*/*.parquet
            out/hecras*/work/**/*.txt
            out/hecras*/work/**/*.log
            out/hecras*/work/**/*.LOG
            out/hecras*/work/**/*.png
            out/hecras*/work/**/*.hdf
            out/curves/**/*.curve.json
            out/inputs_zip/*.inputs.zip

