name: Pages

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # SWMM 5.1.15 (swmm-toolkit 0.10.0) needs Python 3.10. Set it up first so
      # the 3.12 setup below stays the default `python` for every other step.
      - uses: actions/setup-python@v5
        id: py310
        with:
          python-version: "3.10"
      - name: Install SWMM 5.1.15 for the Track B demo
        run: ${{ steps.py310.outputs.python-path }} -m pip install -q "swmm-toolkit==0.10.0"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,engines,site]"

      - uses: actions/cache@v4
        with:
          path: .cache/sources
          key: sources-${{ hashFiles('test_catalog/**/manifest.json') }}

      - name: Fetch remote inputs (verified by SHA-256)
        run: python scripts/fetch_inputs.py

      - name: Track A demo runs (1D slice, 2D finite volume)
        run: |
          python scripts/run_vertical_slice.py || true
          python scripts/run_demo_2d.py A2A-001 A2C-EA1 A2C-EA2 A2C-EA4 A2C-EA5 || true

      # Track B demonstration: older engine releases scored against the pinned references.
      - name: Track B demo runs (SWMM 5.1.15, EPANET 2.0)
        run: |
          python scripts/run_track_b.py --swmm51-python "${{ steps.py310.outputs.python-path }}"

      - name: Build site
        run: |
          python site/build.py \
            --scorecards site/fixtures/scorecards \
            --scorecards out/track_b --scorecards out/vertical_slice --scorecards out/demo_2d
          for f in index catalog corpus reports downloads method get-started; do test -f "site/dist/$f.html"; done
          test -f site/dist/data/benchmark1d2d-catalog.zip

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
