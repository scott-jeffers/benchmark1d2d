name: Pages

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # SWMM 5.1.15 (swmm-toolkit 0.10.0) needs Python 3.10. Set it up first so
      # the 3.12 setup below stays the default `python` for every other step.
      - uses: actions/setup-python@v5
        id: py310
        with:
          python-version: "3.10"
      - name: Install SWMM 5.1.15 for the Track B demo
        run: ${{ steps.py310.outputs.python-path }} -m pip install -q "swmm-toolkit==0.10.0"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,engines,site]"

      - uses: actions/cache@v4
        with:
          path: .cache/sources
          key: sources-${{ hashFiles('test_catalog/**/manifest.json') }}

      - name: Fetch remote inputs (verified by SHA-256)
        run: python scripts/fetch_inputs.py

      - name: Track A runs (1D demo, EPANET 2.2 networks, 2D finite volume)
        run: |
          python scripts/run_vertical_slice.py || true
          python scripts/run_network_cases.py || true
          python scripts/run_demo_2d.py || true

      # Track B demonstration: older engine releases scored against the pinned references.
      - name: Track B demo runs (SWMM 5.1.15, OpenSWMM Engine v6, Hydra, EPANET 2.0)
        run: |
          HYDRA=$(python scripts/fetch_hydra.py "$RUNNER_TEMP/hydra") || echo "::warning::Hydra CLI not fetched"
          [ -x "$HYDRA" ] && python scripts/run_track_b.py --hydra-exe "$HYDRA" --only-hydra || true
          [ -x "$HYDRA" ] && python scripts/run_network_cases.py --hydra-exe "$HYDRA" || true
          python -m venv "$RUNNER_TEMP/openswmm"
          "$RUNNER_TEMP/openswmm/bin/python" -m pip install -q "openswmm==6.0.0a4.dev1" numpy || echo "::warning::openswmm wheel not installed"
          OS_ARG=""; [ -x "$RUNNER_TEMP/openswmm/bin/python" ] && "$RUNNER_TEMP/openswmm/bin/python" -c "import openswmm.engine" && OS_ARG="--openswmm-python $RUNNER_TEMP/openswmm/bin/python"
          python scripts/run_track_b.py --swmm51-python "${{ steps.py310.outputs.python-path }}" $OS_ARG

      - name: Build site
        run: |
          python site/build.py \
            --scorecards site/fixtures/scorecards \
            --scorecards out/track_b --scorecards out/openswmm --scorecards out/hydra --scorecards out/hydra_networks --scorecards out/vertical_slice --scorecards out/networks --scorecards out/demo_2d
          for f in index catalog corpus reports downloads method get-started; do test -f "site/dist/$f.html"; done
          test -f site/dist/data/benchmark1d2d-catalog.zip

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
