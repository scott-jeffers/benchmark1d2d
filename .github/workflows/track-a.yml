name: Track A

on:
  pull_request:
  push:
    branches: [main, master]
    paths:
      - "references/**"
      - "runner/python/**"
      - "test_catalog/track_a/**"
      - "schemas/v1/**"
      - "pyproject.toml"
      - "tools/**"
      - ".github/workflows/track-a.yml"

jobs:
  track-a:
    name: References, metrics, demo score
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Pytest references
        run: python -m pytest references/tests -q

      - name: Pytest runner metrics / convergence
        run: python -m pytest runner/python/tests -q

      - name: Demo score A1F-010 (if CLI available)
        continue-on-error: true
        run: |
          set -euo pipefail
          if ! command -v benchmark1d2d >/dev/null 2>&1; then
            echo "benchmark1d2d CLI not on PATH; skipping demo score"
            exit 0
          fi
          SOLVER="examples/demo_solver/solve.py"
          if [ ! -f "$SOLVER" ]; then
            echo "Demo solver missing at $SOLVER; skipping demo score"
            exit 0
          fi
          mkdir -p out
          benchmark1d2d run A1F-010 --solver "$SOLVER" --adapter generic_parquet || true
          if [ -f out/A1F-010.parquet ]; then
            benchmark1d2d score A1F-010 --results out/A1F-010.parquet
          else
            echo "No results parquet produced; demo score skipped"
          fi
