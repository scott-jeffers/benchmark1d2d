name: Track A

on:
  pull_request:
  push:
    branches: [main, master]

env:
  BENCH_KEEP_INPUTS: out/inputs  # runners keep a copy of the model files they write (Run it yourself)

jobs:
  tests:
    name: Harness and reference tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,engines]"
      - name: Pytest (references, scorer, schemas)
        run: python -m pytest -q

  demo:
    name: Demo solvers and EPANET 2.2 end to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,engines]"
      - uses: actions/cache@v4
        with:
          path: .cache/sources
          key: sources-${{ hashFiles('test_catalog/**/manifest.json') }}
      - run: python scripts/fetch_inputs.py
      # Every scored Track A case has a run that passes it; a failure here means
      # the scorer, a reference or a demo solver regressed.
      - name: 1D cases (dam breaks, backwater, jump, water hammer, tracer)
        run: python scripts/run_vertical_slice.py
      - name: Pipe networks on EPA EPANET 2.2
        run: python scripts/run_network_cases.py
      - name: 2D cases (Thacker, MacDonald 2D, oblique jump, EA 1, 2, 4, 5)
        run: python scripts/run_demo_2d.py
      - name: Export the chart curves (site/fixtures/curves via the result collector)
        if: always()
        shell: bash -l {0}
        run: python scripts/export_curves.py || echo "::warning title=Chart curves::not exported"
      - name: Export the network results (site/fixtures/netres via the result collector)
        if: always()
        run: python scripts/export_netresults.py || echo "::warning title=Network results::not exported"
      - name: Zip the kept model files (site/fixtures/inputs via the result collector)
        if: always()
        shell: bash -l {0}
        run: python scripts/export_inputs.py || echo "::warning title=Model files::not zipped"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: track-a-scorecards
          path: |
            out/vertical_slice/*.scorecard.json
            out/networks/*.scorecard.json
            out/demo_2d/*.scorecard.json
            out/curves/**/*.curve.json
            out/netres/**/*.netres.json
            out/inputs_zip/*.inputs.zip

  telemac:
    name: openTELEMAC-2D (finding, not a gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: telemac
          create-args: -c conda-forge opentelemac=v9.1.1 python=3.12
          init-shell: none
      - name: Score TELEMAC-2D (EA Tests 2 and 5 run in slow-runs.yml)
        run: |
          python scripts/fetch_inputs.py
          python scripts/run_telemac.py --telemac-prefix "$MAMBA_ROOT_PREFIX/envs/telemac" \
            A1F-010 A1F-011 A1F-040 A1F-041 A1F-042 A1F-043 A2A-001 A2A-010 A2A-020 A2C-EA1 A2C-EA4 \
            || echo "::warning title=TELEMAC-2D::fails at least one criterion (see score cards); reported, not gating"
      - name: Export the chart curves (site/fixtures/curves via the result collector)
        if: always()
        shell: bash -l {0}
        run: python scripts/export_curves.py || echo "::warning title=Chart curves::not exported"
      - name: Zip the kept model files (site/fixtures/inputs via the result collector)
        if: always()
        shell: bash -l {0}
        run: python scripts/export_inputs.py || echo "::warning title=Model files::not zipped"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: telemac-scorecards
          path: |
            out/telemac/*.scorecard.json
            out/curves/**/*.curve.json
            out/inputs_zip/*.inputs.zip


  swmm:
    name: SWMM 5.2.4, OpenSWMM Engine v6 and Hydra on the 1D channel cases (finding, not a gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,engines]"
          python -m venv "$RUNNER_TEMP/openswmm"
          "$RUNNER_TEMP/openswmm/bin/python" -m pip install -q "openswmm==6.0.0a4.dev1" numpy
      - name: Score the dam breaks and the backwater curve
        run: |
          HYDRA=$(python scripts/fetch_hydra.py "$RUNNER_TEMP/hydra")
          python scripts/run_swmm_track_a.py --openswmm-python "$RUNNER_TEMP/openswmm/bin/python" --hydra-exe "$HYDRA" \
            || echo "::warning title=SWMM Track A::fails at least one criterion (see score cards); reported, not gating"
      - name: Score the exact drainage-network cases (A1D)
        run: |
          python scripts/run_drainage_cases.py --openswmm-python "$RUNNER_TEMP/openswmm/bin/python" \
            --hydra-exe "$(python scripts/fetch_hydra.py "$RUNNER_TEMP/hydra")"
      - name: Export the chart curves (site/fixtures/curves via the result collector)
        if: always()
        shell: bash -l {0}
        run: python scripts/export_curves.py || echo "::warning title=Chart curves::not exported"
      - name: Export the network results (site/fixtures/netres via the result collector)
        if: always()
        run: python scripts/export_netresults.py || echo "::warning title=Network results::not exported"
      - name: Zip the kept model files (site/fixtures/inputs via the result collector)
        if: always()
        shell: bash -l {0}
        run: python scripts/export_inputs.py || echo "::warning title=Model files::not zipped"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: swmm-track-a-scorecards
          path: |
            out/swmm_track_a/*/*.scorecard.json
            out/curves/**/*.curve.json
            out/netres/**/*.netres.json
            out/inputs_zip/*.inputs.zip
