name: Track A

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  tests:
    name: Harness and reference tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,engines]"
      - name: Pytest (references, scorer, schemas)
        run: python -m pytest -q

  demo:
    name: Demo solvers and EPANET 2.2 end to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,engines]"
      - uses: actions/cache@v4
        with:
          path: .cache/sources
          key: sources-${{ hashFiles('test_catalog/**/manifest.json') }}
      - run: python scripts/fetch_inputs.py
      # Every scored Track A case has a run that passes it; a failure here means
      # the scorer, a reference or a demo solver regressed.
      - name: 1D cases (dam breaks, backwater, jump, water hammer, tracer)
        run: python scripts/run_vertical_slice.py
      - name: Pipe networks on EPA EPANET 2.2
        run: python scripts/run_network_cases.py
      - name: 2D cases (Thacker, MacDonald 2D, oblique jump, EA 1, 2, 4, 5)
        run: python scripts/run_demo_2d.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: track-a-scorecards
          path: |
            out/vertical_slice/*.scorecard.json
            out/networks/*.scorecard.json
            out/demo_2d/*.scorecard.json
