name: Track B PR tier

on:
  pull_request:
    paths:
      - "test_catalog/track_b/**"
      - "runner/**"
      - "reference_engines/**"
      - "schemas/v1/**"
      - "tools/**"
      - ".github/workflows/track-b-pr-tier.yml"
  push:
    branches: [main, master]
    paths:
      - "test_catalog/track_b/tier_pr/**"

jobs:
  tier-pr:
    name: Validate Track B tier_pr manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ensure tier_pr manifests exist
        run: |
          set -euo pipefail
          count=$(find test_catalog/track_b/tier_pr -name manifest.json | wc -l)
          echo "Found $count tier_pr manifest(s)"
          test "$count" -ge 1

      - name: Validate catalog (tier_pr covered by full scan)
        run: python tools/validate_catalog.py --allow-placeholder-hash

      - name: Verify SWMM pin.json sync
        run: python -c "from benchmark1d2d.engines import assert_pin_matches_sha256sums; assert_pin_matches_sha256sums()"

      - name: Note — full self-parity on Windows
        run: |
          echo "Schema/hash/license checks done on ubuntu."
          echo "Full SWMM win64 self-parity runs in workflow swmm-self-parity.yml and pages.yml."
