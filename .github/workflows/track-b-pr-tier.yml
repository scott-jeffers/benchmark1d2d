name: Track B PR tier

on:
  pull_request:
    paths:
      - "test_catalog/track_b/**"
      - "runner/**"
      - "reference_engines/**"
      - "schemas/v1/**"
      - "tools/**"
      - ".github/workflows/track-b-pr-tier.yml"
  push:
    branches: [main, master]
    paths:
      - "test_catalog/track_b/tier_pr/**"

jobs:
  tier-pr:
    name: Validate Track B tier_pr manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install jsonschema
        run: python -m pip install --upgrade pip jsonschema

      - name: Ensure tier_pr manifests exist
        run: |
          set -euo pipefail
          count=$(find test_catalog/track_b/tier_pr -name manifest.json | wc -l)
          echo "Found $count tier_pr manifest(s)"
          test "$count" -ge 1

      - name: Validate catalog (tier_pr covered by full scan)
        run: python tools/validate_catalog.py --allow-placeholder-hash

      - name: Skeleton — pinned-engine parity gate
        run: |
          echo "Track B PR-tier skeleton: schema/hash/license checks only."
          echo "Full SWMM self-parity and corpus index jobs land in a later phase."
