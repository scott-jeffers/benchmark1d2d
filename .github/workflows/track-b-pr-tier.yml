name: Track B PR tier

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  references:
    name: Engine references are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,engines]"
      - name: Fetch non-committed inputs (verified by SHA-256)
        run: python scripts/fetch_inputs.py B-
      # Re-run SWMM 5.2.4 and EPANET 2.2 on every catalog Track B case and fail if a
      # committed reference no longer matches what the pinned engine produces.
      - run: python scripts/make_reference.py --check

  corpus-pr-tier:
    name: PR-tier corpus runs on SWMM 5.2.4
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,engines]"
      - name: Check out HydroCouple corpus at the pinned commit
        run: |
          COMMIT=$(python -c "import json;print(json.load(open('test_catalog/track_b/tier_pr/selection.json'))['upstream_commit'])")
          git init -q hc && cd hc
          git remote add origin https://github.com/HydroCouple/openswmm.engine.benchmarks
          git fetch -q --depth 1 origin "$COMMIT" && git checkout -q FETCH_HEAD
      - name: Every PR-tier model must run cleanly
        run: python scripts/corpus_census.py --corpus hc/corpus --only test_catalog/track_b/tier_pr/selection.json --timeout 60 --fail-on-error --out out/pr_census.parquet

  cross-build:
    name: Official Windows SWMM 5.2.4 build vs reference
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,engines]"
      - name: Fetch pinned SWMM win64
        shell: pwsh
        run: |
          $pin = Get-Content reference_engines/swmm-5.2.4/pin.json | ConvertFrom-Json
          New-Item -ItemType Directory -Force -Path reference_engines/swmm-5.2.4/vendor, reference_engines/swmm-5.2.4/bin | Out-Null
          $zip = "reference_engines/swmm-5.2.4/vendor/$($pin.asset)"
          Invoke-WebRequest $pin.asset_url -OutFile $zip
          Expand-Archive $zip -DestinationPath reference_engines/swmm-5.2.4/vendor/extracted -Force
          $src = Get-ChildItem -Recurse reference_engines/swmm-5.2.4/vendor/extracted -Filter runswmm.exe | Select-Object -First 1
          Copy-Item "$($src.DirectoryName)/runswmm.exe","$($src.DirectoryName)/swmm5.dll","$($src.DirectoryName)/swmm-output.dll" reference_engines/swmm-5.2.4/bin/
      - name: Score the official build against the committed references
        run: python scripts/run_swmm_self_parity.py
      - name: Keep the cross-build score cards
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-build-scorecards
          path: out/cross_build/*.json
