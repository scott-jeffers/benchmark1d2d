name: Nightly

on:
  schedule:
    # 05:17 UTC daily
    - cron: "17 5 * * *"
  workflow_dispatch:

jobs:
  nightly:
    name: Full pytest + catalog validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Full pytest
        run: python -m pytest -q

      - name: Validate catalog
        run: python tools/validate_catalog.py --allow-placeholder-hash --self-test

      - name: DOI check (soft)
        continue-on-error: true
        run: python tools/validate_catalog.py --allow-placeholder-hash --check-doi
