name: Nightly

on:
  schedule:
    # 05:17 UTC daily
    - cron: "17 5 * * *"
  workflow_dispatch:

jobs:
  nightly:
    name: Full pytest + catalog validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,engines]"

      - name: Full pytest
        run: python -m pytest -q

      - name: Validate catalog
        run: python tools/validate_catalog.py --self-test

      - name: DOI check (soft)
        continue-on-error: true
        run: python tools/validate_catalog.py --check-doi

  corpus-nightly-tier:
    name: Nightly-tier corpus on SWMM 5.2.4
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      # SWMM 5.1.15 (the parity demonstration candidate) needs Python 3.10; set it
      # up first so 3.12 stays the default interpreter.
      - uses: actions/setup-python@v5
        id: py310
        with:
          python-version: "3.10"
      - run: ${{ steps.py310.outputs.python-path }} -m pip install -q "swmm-toolkit==0.10.0"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,engines]"
      - name: Check out HydroCouple corpus at the pinned commit
        run: |
          COMMIT=$(python -c "import json;print(json.load(open('test_catalog/track_b/tier_nightly/selection.json'))['upstream_commit'])")
          git init -q hc && cd hc
          git remote add origin https://github.com/HydroCouple/openswmm.engine.benchmarks
          for i in 1 2 3 4; do git fetch -q --depth 1 origin "$COMMIT" && break; echo "fetch failed (attempt $i), retrying"; sleep $((i * 10)); done
          git checkout -q FETCH_HEAD
      - run: python scripts/corpus_census.py --corpus hc/corpus --only test_catalog/track_b/tier_nightly/selection.json --timeout 60 --workers 4 --fail-on-error --out out/nightly_census.parquet
      - name: Parity of SWMM 5.1.15 against 5.2.4 across the tier (a finding, not a gate)
        run: python scripts/corpus_parity.py --corpus hc/corpus --tier nightly --candidate-python "${{ steps.py310.outputs.python-path }}" --label swmm-5.1.15 --workers 4 --timeout 90 || true
      - name: Parity of OpenSWMM Engine v6 (HydroCouple SWMM 6) against 5.2.4 across the tier (a finding, not a gate)
        run: |
          python -m venv "$RUNNER_TEMP/openswmm"
          "$RUNNER_TEMP/openswmm/bin/python" -m pip install -q "openswmm==6.0.0a4.dev1" numpy
          python scripts/corpus_parity.py --corpus hc/corpus --tier nightly --candidate-python "$RUNNER_TEMP/openswmm/bin/python" --candidate-engine openswmm --label openswmm-6 --workers 4 --timeout 600 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-census
          path: |
            out/nightly_census.parquet
            out/corpus_parity/*
