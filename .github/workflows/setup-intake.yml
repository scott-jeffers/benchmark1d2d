name: Set-up intake

# A "Propose a better set-up" issue becomes setups/<slug>/setup.json, which the
# set-ups workflow re-runs. No one approves it: a set-up that passes the checks
# in benchmark1d2d.setups runs, and its result is shown beside the suite's own.
on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  issues: write
  actions: write  # start the set-ups workflow (bot pushes do not trigger it)

concurrency:
  group: setup-intake-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  intake:
    if: contains(github.event.issue.labels.*.name, 'set-up proposal') && github.event.issue.state == 'open'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -q -e ".[dev]"
      - name: Read the proposal
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          mkdir -p out/intake
          gh issue view "$NUMBER" -R "$GITHUB_REPOSITORY" --json body -q .body > out/intake/setup.md
      - name: Build and check the set-up
        id: build
        env:
          NUMBER: ${{ github.event.issue.number }}
          AUTHOR: ${{ github.event.issue.user.login }}
        run: |
          set +e
          slug=$(python scripts/intake_setup.py --issue-body out/intake/setup.md --issue-number "$NUMBER" --author "$AUTHOR" --reply out/intake/reply.md)
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "slug=$slug" >> "$GITHUB_OUTPUT"
      - name: Commit it and start the run
        if: steps.build.outputs.status == '0'
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
          SLUG: ${{ steps.build.outputs.slug }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add setups
          if ! git diff --cached --quiet; then
            git commit -q -m "Proposed set-up from issue #$NUMBER"
            for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
          fi
          gh workflow run setups.yml -R "$GITHUB_REPOSITORY" --ref master -f setups="setups/$SLUG"
      - name: Reply
        if: always() && steps.build.outputs.status != ''
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
          OK: ${{ steps.build.outputs.status == '0' }}
        run: |
          gh issue comment "$NUMBER" -R "$GITHUB_REPOSITORY" --body-file out/intake/reply.md
          if [ "$OK" = "true" ]; then gh issue close "$NUMBER" -R "$GITHUB_REPOSITORY" --reason completed; fi
