name: Bellinge parity

# The Bellinge data set (Pedersen et al. 2021, CC BY 4.0; DTU Data,
# doi:10.11583/DTU.c.5029124): a real 1.7 km² combined sewer system in
# Odense, about 1,000 nodes and 1,000 links with pumps, weirs and control
# rules, published as an EPA SWMM model. Its file store is not reachable from
# the build sandbox, so this job downloads the model on a runner, checks the
# published MD5 and records the SHA-256 (scripts/bellinge.py), then scores
# each candidate engine against EPA SWMM 5.2.4 on it, element by element, as
# the nightly corpus does. One event (29-30 June 2012) takes tens of minutes
# per engine, so it runs weekly rather than in the nightly tier.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 0"  # weekly, Sunday 03:17 UTC
  push:
    branches: [master]
    paths:
      - .github/workflows/bellinge.yml
      - scripts/bellinge.py

jobs:
  parity:
    name: Bellinge, ${{ matrix.candidate }} vs SWMM 5.2.4
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        candidate: [openswmm-6, openswmm-6-fv, hydra]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download, verify and stage the model
        run: |
          python -m pip install -q -e ".[dev]" swmm-toolkit==0.17.0
          python scripts/bellinge.py fetch --out out/bellinge
          mkdir -p out/bellinge/corpus/bellinge
          cp out/bellinge/model/7_SWMM/*.inp out/bellinge/corpus/bellinge/model.inp
          cp out/bellinge/model/7_SWMM/*.dat out/bellinge/corpus/bellinge/
      - name: Score ${{ matrix.candidate }} against SWMM 5.2.4 (a finding, not a gate)
        run: |
          case "${{ matrix.candidate }}" in
            openswmm-6|openswmm-6-fv)
              python -m venv "$RUNNER_TEMP/openswmm"
              "$RUNNER_TEMP/openswmm/bin/python" -m pip install -q "openswmm==6.0.0a4.dev1" numpy
              ROUTING=""; [ "${{ matrix.candidate }}" = "openswmm-6-fv" ] && ROUTING="--candidate-routing FV"
              python scripts/corpus_parity.py --corpus out/bellinge/corpus --models bellinge --stem "bellinge_${{ matrix.candidate }}" \
                --candidate-python "$RUNNER_TEMP/openswmm/bin/python" --candidate-engine openswmm $ROUTING \
                --label "${{ matrix.candidate }}" --workers 1 --timeout 6000 || true ;;
            hydra)
              HYDRA=$(python scripts/fetch_hydra.py "$RUNNER_TEMP/hydra")
              python scripts/corpus_parity.py --corpus out/bellinge/corpus --models bellinge --stem bellinge_hydra \
                --candidate-python "$HYDRA" --candidate-engine hydra --label hydra --workers 1 --timeout 6000 || true ;;
          esac
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bellinge-${{ matrix.candidate }}
          path: |
            out/corpus_parity/bellinge_*
            out/bellinge/fetch.json
            out/bellinge/inventory.txt
