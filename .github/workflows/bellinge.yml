name: Bellinge parity

# The Bellinge data set (Pedersen et al. 2021, CC BY 4.0; DTU Data,
# doi:10.11583/DTU.c.5029124): a real 1.7 km² combined sewer system in
# Odense, about 1,000 nodes and 1,000 links with pumps, weirs and control
# rules, published as an EPA SWMM model. Its file store is not reachable from
# the build sandbox, so this job downloads the model on a runner, checks the
# published MD5 and records the SHA-256 (scripts/bellinge.py), then scores
# each candidate engine against EPA SWMM 5.2.4 on it, element by element, as
# the nightly corpus does. One event (29-30 June 2012) takes tens of minutes
# per engine, so it runs weekly rather than in the nightly tier.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 0"  # weekly, Sunday 03:17 UTC
  push:
    branches: [master]
    paths:
      - .github/workflows/bellinge.yml
      - scripts/bellinge.py
      - scripts/run_bellinge.py
      - test_catalog/track_a/1d_free_surface/A1F-100_bellinge_urban_drainage/**

# a newer push supersedes a run still going (the runs are long)
concurrency:
  group: bellinge-${{ github.ref }}
  cancel-in-progress: true

env:
  BENCH_KEEP_INPUTS: out/inputs  # runners keep a copy of the model files they write (Run it yourself)

jobs:
  field:
    # A1F-100: the published model against the measured levels at the level meters, storm by storm
    name: A1F-100, ${{ matrix.engine }} against the level meters
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        engine: [swmm524, openswmm-dw, hydra-uds]  # not FV: 78 min a storm on this model (the parity job runs it once)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download and verify the model
        run: |
          python -m pip install -q -e ".[dev]" swmm-toolkit==0.17.0
          python scripts/bellinge.py fetch --out out/bellinge
      - name: Run ${{ matrix.engine }} on every storm and score it (a finding, not a gate)
        run: |
          ARGS=""
          case "${{ matrix.engine }}" in
            openswmm-*)
              python -m venv "$RUNNER_TEMP/openswmm"
              "$RUNNER_TEMP/openswmm/bin/python" -m pip install -q "openswmm==6.0.0a4.dev1" numpy
              ARGS="--openswmm-python $RUNNER_TEMP/openswmm/bin/python" ;;
            hydra-uds) ARGS="--hydra-exe $(python scripts/fetch_hydra.py "$RUNNER_TEMP/hydra")" ;;
          esac
          python scripts/run_bellinge.py --model-dir out/bellinge/model/7_SWMM --engines ${{ matrix.engine }} $ARGS --timeout 7200
      - name: Export the chart curves (site/fixtures/curves via the result collector)
        if: always()
        run: python scripts/export_curves.py --only ${{ matrix.engine }} || echo "::warning title=Curves::not exported"
      - name: Export the network results (site/fixtures/netres via the result collector)
        if: always()
        run: python scripts/export_netresults.py || echo "::warning title=Network results::not exported"
      - name: Zip the model files (Run it yourself)
        if: always()
        run: python scripts/export_inputs.py || echo "::warning title=Model files::not zipped"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bellinge-field-${{ matrix.engine }}
          path: |
            out/swmm_track_a/**/A1F-100_*.scorecard.json
            out/swmm_track_a/**/A1F-100_*.parquet
            out/swmm_track_a/**/A1F-100.runs.json
            out/curves/**/A1F-100.curve.json
            out/netres/**/A1F-100.netres.json
            out/inputs_zip/*.inputs.zip


  parity:
    name: Bellinge, ${{ matrix.candidate }} vs SWMM 5.2.4
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        candidate: [openswmm-6, openswmm-6-fv, hydra]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download, verify and stage the model
        run: |
          python -m pip install -q -e ".[dev]" swmm-toolkit==0.17.0
          python scripts/bellinge.py fetch --out out/bellinge
          mkdir -p out/bellinge/corpus/bellinge
          cp out/bellinge/model/7_SWMM/*.inp out/bellinge/corpus/bellinge/model.inp
          cp out/bellinge/model/7_SWMM/*.dat out/bellinge/corpus/bellinge/
      - name: Score ${{ matrix.candidate }} against SWMM 5.2.4 (a finding, not a gate)
        run: |
          case "${{ matrix.candidate }}" in
            openswmm-6|openswmm-6-fv)
              python -m venv "$RUNNER_TEMP/openswmm"
              "$RUNNER_TEMP/openswmm/bin/python" -m pip install -q "openswmm==6.0.0a4.dev1" numpy
              ROUTING=""; [ "${{ matrix.candidate }}" = "openswmm-6-fv" ] && ROUTING="--candidate-routing FV"
              python scripts/corpus_parity.py --corpus out/bellinge/corpus --models bellinge --stem "bellinge_${{ matrix.candidate }}" \
                --candidate-python "$RUNNER_TEMP/openswmm/bin/python" --candidate-engine openswmm $ROUTING \
                --label "${{ matrix.candidate }}" --workers 1 --timeout 6000 || true ;;
            hydra)
              HYDRA=$(python scripts/fetch_hydra.py "$RUNNER_TEMP/hydra")
              python scripts/corpus_parity.py --corpus out/bellinge/corpus --models bellinge --stem bellinge_hydra \
                --candidate-python "$HYDRA" --candidate-engine hydra --label hydra --workers 1 --timeout 6000 || true ;;
          esac
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bellinge-${{ matrix.candidate }}
          path: |
            out/corpus_parity/bellinge_*
            out/bellinge/fetch.json
            out/bellinge/inventory.txt
