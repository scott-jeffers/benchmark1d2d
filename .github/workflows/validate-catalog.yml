name: Validate catalog

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  validate:
    name: Schema / hash / license
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install jsonschema
        run: python -m pip install --upgrade pip jsonschema

      - name: Validate catalog (allow placeholder hashes)
        run: python tools/validate_catalog.py --allow-placeholder-hash --self-test

  doi-check:
    name: Crossref DOI check
    runs-on: ubuntu-latest
    # Soft gate on PRs; still runs on main for visibility.
    continue-on-error: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install jsonschema
        run: python -m pip install --upgrade pip jsonschema

      - name: Validate catalog with strict DOI checks
        run: python tools/validate_catalog.py --allow-placeholder-hash --check-doi
