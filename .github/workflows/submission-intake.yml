name: Submission intake

# Results sent through the "Submit results" issue form (the Publish button on
# the site's Score page fills it in): the bot reads the attached zip, scores it
# with the suite's scorer and replies on the issue. When a maintainer adds the
# `publish` label, the bot commits the folder under submissions/ and closes the
# issue; the next site build shows the results.
on:
  issues:
    types: [opened, edited, labeled]
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

concurrency:
  group: intake-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  intake:
    if: >-
      contains(github.event.issue.labels.*.name, 'submission') &&
      github.event.issue.state == 'open' &&
      (github.event_name != 'issues' || github.event.action != 'labeled' || github.event.label.name == 'publish') &&
      (github.event_name != 'issue_comment' || github.event.comment.user.login == github.event.issue.user.login)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -q -e ".[dev]"
      - name: Read the issue (and the submitter's later comments, which may carry fixed files)
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          mkdir -p out/intake
          gh issue view "$NUMBER" -R "$GITHUB_REPOSITORY" --json body,author,comments \
            -q '.author.login as $a | .body + "\n\n" + ([.comments[] | select(.author.login == $a) | .body] | join("\n\n"))' > out/intake/body.md
      - name: Score it
        id: score
        env:
          NUMBER: ${{ github.event.issue.number }}
          PUBLISH: ${{ github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == 'publish' }}
        run: |
          set +e
          ARGS=""; [ "$PUBLISH" = "true" ] && ARGS="--publish"
          python scripts/intake_submission.py --issue-body out/intake/body.md --issue-number "$NUMBER" --reply out/intake/reply.md $ARGS
          echo "status=$?" >> "$GITHUB_OUTPUT"
      - name: Commit the published folder
        if: github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == 'publish' && steps.score.outputs.status == '0'
        env:
          NUMBER: ${{ github.event.issue.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add submissions
          git diff --cached --quiet && exit 0
          git commit -m "Submitted results from issue #$NUMBER"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
      - name: Reply on the issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
          PUBLISHED: ${{ github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == 'publish' && steps.score.outputs.status == '0' }}
        run: |
          [ -f out/intake/reply.md ] || echo "The bot could not read this issue; a maintainer will look." > out/intake/reply.md
          gh issue comment "$NUMBER" -R "$GITHUB_REPOSITORY" --body-file out/intake/reply.md
          if [ "$PUBLISHED" = "true" ]; then gh issue close "$NUMBER" -R "$GITHUB_REPOSITORY"; fi
