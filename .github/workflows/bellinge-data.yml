name: Bellinge data

# Inventories and extracts the Bellinge observations (DTU Data, CC BY 4.0) on a
# runner: the file store is not reachable from the build sandbox. Run by hand.
on:
  workflow_dispatch:
    inputs:
      action:
        description: "inventory or extract"
        default: inventory
  push:
    branches: [master]
    paths:
      - .github/workflows/bellinge-data.yml

jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inventory the sensor data and the radar rainfall
        run: |
          python -m pip install -q -e ".[dev]"
          python scripts/bellinge.py inventory --role observations --out out/bellinge_data
          python scripts/bellinge.py inventory --role rainfall --out out/bellinge_data || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bellinge-data
          path: out/bellinge_data/*.txt
