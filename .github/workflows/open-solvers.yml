name: Open-source solvers

# Production open-source codes run as black boxes on the catalog. Each job
# installs its solver from the official source, runs every case it supports
# on every refinement level and uploads its score cards. A scored fail is a
# finding about the solver (reported as a warning), not a broken build.
on:
  workflow_dispatch:
  schedule:
    - cron: "41 4 * * 1"  # weekly, Monday 04:41 UTC
  push:
    branches: [master]
    paths:
      - scripts/run_anuga.py
      - scripts/run_geoclaw.py
      - scripts/run_lisflood.py
      - scripts/run_hydronet.py
      - scripts/run_coupled_cases.py
      - .github/workflows/open-solvers.yml
      - references/**
      - runner/python/benchmark1d2d/scoring/**
      - test_catalog/track_a/**

jobs:
  anuga:
    name: ANUGA 4.0.1
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: anuga
          create-args: -c conda-forge anuga=4.0.1 python=3.12 pip scipy
          init-shell: bash
      - name: Run and score ANUGA
        shell: micromamba-shell {0}
        run: |
          python -m pip install -q -e ".[dev]"
          python scripts/fetch_inputs.py  # EA terrain and tables, verified by SHA-256
          # EA Tests 2 and 5 take hours with ANUGA; they run in slow-runs.yml.
          python scripts/run_anuga.py A1F-010 A1F-011 A2A-001 A2A-010 A2A-020 A2C-EA1 A2C-EA4
      - name: Export the chart curves (site/fixtures/curves via the result collector)
        if: always()
        shell: bash -l {0}
        run: python scripts/export_curves.py || echo "::warning title=Chart curves::not exported"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: anuga-scorecards
          path: |
            out/anuga/*.scorecard.json
            out/curves/**/*.curve.json

  coupled:
    name: SWMM 5.2.4 + ANUGA 4.0.1 (coupled 1D/2D)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: anuga
          create-args: -c conda-forge anuga=4.0.1 python=3.12 pip scipy
          init-shell: bash
      - name: Run and score the exact coupling cases
        shell: micromamba-shell {0}
        run: |
          python -m pip install -q -e ".[dev]" swmm-toolkit==0.17.0
          python scripts/run_coupled_cases.py
      - name: Export the chart curves (site/fixtures/curves via the result collector)
        if: always()
        shell: bash -l {0}
        run: python scripts/export_curves.py || echo "::warning title=Chart curves::not exported"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coupled-scorecards
          path: |
            out/coupled/*/*.scorecard.json
            out/curves/**/*.curve.json

  geoclaw:
    name: GeoClaw 5.9.2
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Clawpack source (tag v5.9.2)
        run: git clone -q --depth 1 --branch v5.9.2 --recurse-submodules --shallow-submodules https://github.com/clawpack/clawpack "$RUNNER_TEMP/clawpack"
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: claw
          create-args: -c conda-forge clawpack=5.9.0 python=3.11 gfortran make pip pyarrow pandas
          init-shell: bash
      - name: Build, run and score GeoClaw
        shell: micromamba-shell {0}
        env:
          FC: gfortran
          # An MPI library in the conda environment initialises UCX, whose
          # InfiniBand transport fails on some runner images (MANA NIC);
          # TCP and shared memory are enough on one machine.
          UCX_TLS: tcp,self,sm
        run: |
          python -m pip install -q -e ".[dev]"
          PYTHONPATH="$RUNNER_TEMP/clawpack" python scripts/run_geoclaw.py --claw "$RUNNER_TEMP/clawpack"
      - name: Export the chart curves (site/fixtures/curves via the result collector)
        if: always()
        shell: bash -l {0}
        run: python scripts/export_curves.py || echo "::warning title=Chart curves::not exported"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: geoclaw-scorecards
          path: |
            out/geoclaw/*.scorecard.json
            out/curves/**/*.curve.json

  lisflood:
    name: LISFLOOD-FP 8.3 (FV1, DG2, ACC)
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      LF_URL: https://zenodo.org/api/records/13121119/files/LISFLOOD-FP-8.3.zip/content
      LF_MD5: abaa2e41b58f6c7df4443274bf130d4a
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build dependencies
        run: sudo apt-get update -q && sudo apt-get install -y -q libnetcdf-dev libnuma-dev
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/lisflood-src.zip
          key: lisflood-8.3-src-v1
      - name: Download (Zenodo, pinned checksum) and build CPU-only, double precision
        run: |
          zip="$RUNNER_TEMP/lisflood-src.zip"
          # Zenodo sometimes drops long transfers; resume until the checksum matches.
          for i in 1 2 3 4 5 6 7 8; do
            echo "$LF_MD5  $zip" | md5sum -c --status - 2>/dev/null && break
            curl -fsSL --retry 3 --retry-all-errors -C - -o "$zip" "$LF_URL" || sleep 5
          done
          echo "$LF_MD5  $zip" | md5sum -c -
          unzip -q "$zip" -d "$RUNNER_TEMP/lf"
          src=$(dirname "$(find "$RUNNER_TEMP/lf" -path '*/source/CMakeLists.txt' | head -1)")
          cmake -S "$src" -B "$RUNNER_TEMP/lf/build" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/lf/build" -j4 --target lisflood
      - name: Run and score LISFLOOD-FP
        run: |
          python -m pip install -q -e ".[dev]"
          python scripts/fetch_inputs.py  # EA terrain and tables, verified by SHA-256
          python scripts/run_lisflood.py --exe "$RUNNER_TEMP/lf/build/lisflood" --solver fv1 acc
          # DG2 costs several times more per step; EA Tests 2 and 5 run in slow-runs.yml.
          python scripts/run_lisflood.py --exe "$RUNNER_TEMP/lf/build/lisflood" \
            A1F-010 A1F-011 A2A-001 A2A-010 A2C-EA1 A2C-EA4 --solver dg2
      - name: Export the chart curves (site/fixtures/curves via the result collector)
        if: always()
        shell: bash -l {0}
        run: python scripts/export_curves.py || echo "::warning title=Chart curves::not exported"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lisflood-scorecards
          path: |
            out/lisflood/*/*.scorecard.json
            out/curves/**/*.curve.json

  hydronet:
    name: HydroNet finite volume (Penn State)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: HydroNet and pyHMT2D (psu-efd, MIT), CPU PyTorch
        run: |
          # pinned commits (scripts/check_versions.py reports newer ones)
          for r in "HydroNet 0d98ff5dbdd07e8bb56590a4df2b79aebf414a6a" "pyHMT2D 57645ff7af3321a54998f9acb29aa4281380f8e8"; do
            set -- $r; git init -q "$RUNNER_TEMP/$1"
            git -C "$RUNNER_TEMP/$1" fetch -q --depth 1 "https://github.com/psu-efd/$1" "$2"
            git -C "$RUNNER_TEMP/$1" checkout -q FETCH_HEAD
          done
          python -m pip install -q --upgrade pip
          python -m pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -q -e "$RUNNER_TEMP/HydroNet"
          python -m pip install -q -e "$RUNNER_TEMP/pyHMT2D" --no-deps
          python -m pip install -q -e ".[dev]"
      - name: Run and score (the Thacker bowl is reported unstable, not scored)
        run: |
          python scripts/run_hydronet.py --hydronet "$RUNNER_TEMP/HydroNet" --mode fvm \
            --version "$(git -C "$RUNNER_TEMP/HydroNet" rev-parse --short HEAD)"
      - name: Export the chart curves (site/fixtures/curves via the result collector)
        if: always()
        shell: bash -l {0}
        run: python scripts/export_curves.py || echo "::warning title=Chart curves::not exported"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hydronet-fvm-scorecards
          path: |
            out/hydronet/*/*.scorecard.json
            out/curves/**/*.curve.json

