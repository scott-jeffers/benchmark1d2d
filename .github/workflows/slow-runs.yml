name: Slow runs

# Runs too long for the per-push workflows, refreshed weekly: LISFLOOD-FP's
# second-order DG2 solver, ANUGA and TELEMAC-2D on the EA valley tests
# (2 and 5), and HydroNet's FVM-PINN network trained on the dam breaks.
# Score cards are uploaded as artifacts; copy them into site/fixtures/ to
# publish. A scored fail is a finding, not a broken build.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * 6"  # weekly, Saturday 02:17 UTC

env:
  BENCH_KEEP_INPUTS: out/inputs  # runners keep a copy of the model files they write (Run it yourself)

jobs:
  lisflood-dg2:
    name: LISFLOOD-FP 8.3 DG2 on EA Tests 2 and 5
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      LF_URL: https://zenodo.org/api/records/13121119/files/LISFLOOD-FP-8.3.zip/content
      LF_MD5: abaa2e41b58f6c7df4443274bf130d4a
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build dependencies
        run: sudo apt-get update -q && sudo apt-get install -y -q libnetcdf-dev libnuma-dev
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/lisflood-src.zip
          key: lisflood-8.3-src-v1
      - name: Download (Zenodo, pinned checksum) and build CPU-only, double precision
        run: |
          zip="$RUNNER_TEMP/lisflood-src.zip"
          for i in 1 2 3 4 5 6 7 8; do
            echo "$LF_MD5  $zip" | md5sum -c --status - 2>/dev/null && break
            curl -fsSL --retry 3 --retry-all-errors -C - -o "$zip" "$LF_URL" || sleep 5
          done
          echo "$LF_MD5  $zip" | md5sum -c -
          unzip -q "$zip" -d "$RUNNER_TEMP/lf"
          src=$(dirname "$(find "$RUNNER_TEMP/lf" -path '*/source/CMakeLists.txt' | head -1)")
          cmake -S "$src" -B "$RUNNER_TEMP/lf/build" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/lf/build" -j4 --target lisflood
      - name: Run and score
        run: |
          python -m pip install -q -e ".[dev]"
          python scripts/fetch_inputs.py
          python scripts/run_lisflood.py --exe "$RUNNER_TEMP/lf/build/lisflood" A2C-EA2 A2C-EA5 --solver dg2
      - name: Export the chart curves (site/fixtures/curves via the result collector)
        if: always()
        shell: bash -l {0}
        run: python scripts/export_curves.py || echo "::warning title=Chart curves::not exported"
      - name: Zip the kept model files (site/fixtures/inputs via the result collector)
        if: always()
        shell: bash -l {0}
        run: python scripts/export_inputs.py || echo "::warning title=Model files::not zipped"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lisflood-dg2-ea-scorecards
          path: |
            out/lisflood/*/*.scorecard.json
            out/curves/**/*.curve.json
            out/inputs_zip/*.inputs.zip

  anuga-ea:
    name: ANUGA 4.0.1 on EA Tests 2 and 5 and the SWASHES bump
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: anuga
          create-args: -c conda-forge anuga=4.0.1 python=3.12 pip scipy
          init-shell: bash
      - name: Run and score
        shell: micromamba-shell {0}
        run: |
          python -m pip install -q -e ".[dev]"
          python scripts/fetch_inputs.py
          python scripts/run_anuga.py A2C-EA2 A2C-EA5
          python scripts/run_anuga.py A1F-040 A1F-041 A1F-042 A1F-043  # SWASHES bump: ~10 min each on the finest grid
      - name: Export the chart curves (site/fixtures/curves via the result collector)
        if: always()
        shell: bash -l {0}
        run: python scripts/export_curves.py || echo "::warning title=Chart curves::not exported"
      - name: Zip the kept model files (site/fixtures/inputs via the result collector)
        if: always()
        shell: bash -l {0}
        run: python scripts/export_inputs.py || echo "::warning title=Model files::not zipped"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: anuga-ea-scorecards
          path: |
            out/anuga/*.scorecard.json
            out/curves/**/*.curve.json
            out/inputs_zip/*.inputs.zip

  telemac-ea:
    name: openTELEMAC-2D on EA Tests 2 and 5
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python scripts/fetch_inputs.py
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: telemac
          create-args: -c conda-forge opentelemac=v9.1.1 python=3.12
          init-shell: none
      - name: Run and score
        run: python scripts/run_telemac.py --telemac-prefix "$MAMBA_ROOT_PREFIX/envs/telemac" A2C-EA2 A2C-EA5 || true
      - name: Export the chart curves (site/fixtures/curves via the result collector)
        if: always()
        shell: bash -l {0}
        run: python scripts/export_curves.py || echo "::warning title=Chart curves::not exported"
      - name: Zip the kept model files (site/fixtures/inputs via the result collector)
        if: always()
        shell: bash -l {0}
        run: python scripts/export_inputs.py || echo "::warning title=Model files::not zipped"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: telemac-ea-scorecards
          path: |
            out/telemac/*.scorecard.json
            out/curves/**/*.curve.json
            out/inputs_zip/*.inputs.zip

  hydronet-pinn:
    name: HydroNet FVM-PINN on the dam breaks
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: HydroNet and pyHMT2D (psu-efd, MIT), CPU PyTorch
        run: |
          # pinned commits (scripts/check_versions.py reports newer ones)
          for r in "HydroNet 0d98ff5dbdd07e8bb56590a4df2b79aebf414a6a" "pyHMT2D 57645ff7af3321a54998f9acb29aa4281380f8e8"; do
            set -- $r; git init -q "$RUNNER_TEMP/$1"
            git -C "$RUNNER_TEMP/$1" fetch -q --depth 1 "https://github.com/psu-efd/$1" "$2"
            git -C "$RUNNER_TEMP/$1" checkout -q FETCH_HEAD
          done
          python -m pip install -q --upgrade pip
          python -m pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -q -e "$RUNNER_TEMP/HydroNet"
          python -m pip install -q -e "$RUNNER_TEMP/pyHMT2D" --no-deps
          python -m pip install -q -e ".[dev]"
      - name: Train and score
        run: |
          python scripts/run_hydronet.py --hydronet "$RUNNER_TEMP/HydroNet" --mode pinn \
            --version "$(git -C "$RUNNER_TEMP/HydroNet" rev-parse --short HEAD)" A1F-011 A1F-010
      - name: Export the chart curves (site/fixtures/curves via the result collector)
        if: always()
        shell: bash -l {0}
        run: python scripts/export_curves.py || echo "::warning title=Chart curves::not exported"
      - name: Zip the kept model files (site/fixtures/inputs via the result collector)
        if: always()
        shell: bash -l {0}
        run: python scripts/export_inputs.py || echo "::warning title=Model files::not zipped"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hydronet-pinn-scorecards
          path: |
            out/hydronet/*/*.scorecard.json
            out/curves/**/*.curve.json
            out/inputs_zip/*.inputs.zip

